name: "Terraform CI/CD Pipeline"

on:
    push:
        branches:
            - main
        pull_request:
            branches:
                - main
jobs:
    terraform:
        name: "Terraform Lint, Security & Deploy"
        runs-on: ubuntu-latest
    services:
        localstack:
            image: localstack/localstack:3.8.0
            ports:
                - 4566:4566
            env:
                SERVICES: s3,dynamodb,sts,iam,ec2
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Configure AWS Credentials for LocalStack
        run: |
          echo "AWS_ACCESS_KEY_ID=test" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=test" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-east-1" >> $GITHUB_ENV

      - name: 1. Terraform Format Check (Shift-Left)
        run: terraform fmt -check -recursive

      - name: 2. Security Scan with Tfsec (Shift-Left)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: 02-app

      - name: 3. Bootstrap LocalStack State Storage
        run: |
          aws --endpoint-url=http://localhost:4566 s3 mb s3://meu-bucket-tfstate-local
          aws --endpoint-url=http://localhost:4566 dynamodb create-table \
            --table-name meu-lock-table-local \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST

      - name: 4. Terraform Init (02-app)
        run: |
          cd 02-app
          terraform init

      - name: 5. Terraform Validate (02-app)
        run: |
          cd 02-app
          terraform validate

      - name: 6. Terraform Plan (02-app)
        run: |
          cd 02-app
          terraform plan -out=tfplan

      - name: 7. Terraform Apply (02-app on main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cd 02-app
          terraform apply -auto-approve tfplan